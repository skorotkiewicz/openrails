name: Build OpenRails server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: openrails-backend-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: openrails-backend-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: openrails-backend-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: openrails-backend-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: openrails-backend-windows-amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --locked --bin openrails-backend --target ${{ matrix.target }}

      - name: Test server
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist/stage/.github/assets
          cp "target/${{ matrix.target }}/release/openrails-backend${{ runner.os == 'Windows' && '.exe' || '' }}" dist/stage/
          cp README.md config.example.json config.projects.example.json dist/stage/
          cp .github/assets/openrails.svg dist/stage/.github/assets/

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/stage .
          cd dist
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/stage/* -DestinationPath dist/${{ matrix.artifact }}.zip
          $h = (Get-FileHash dist/${{ matrix.artifact }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii dist/${{ matrix.artifact }}.zip.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
